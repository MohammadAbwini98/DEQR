<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DEQR concept 4 — optical reconstruction">
  <title>Concept 4 — Optical Reconstruction</title>
  <desc>Square data modules travel a converging spiral, shrinking and tightening as they approach a solid centre block. Scattered fragments outside, a single resolved block inside: fountain-code reconstruction.</desc>
  <defs>
    <linearGradient id="c4-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131C29"/>
      <stop offset="1" stop-color="#080D14"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#c4-tile)"/>

  <g transform="translate(256 256)">
    <!-- Modules on a logarithmic spiral: radius decays, angle advances, size
         decays with radius. Opacity rises inward as the block resolves. -->
    <g fill="#5AB2FF">
      <rect x="-24" y="-186" width="48" height="48" rx="6" opacity="0.42" transform="rotate(0)"/>
      <rect x="-22" y="-170" width="44" height="44" rx="6" opacity="0.50" transform="rotate(46)"/>
      <rect x="-20" y="-155" width="40" height="40" rx="5" opacity="0.58" transform="rotate(92)"/>
      <rect x="-18" y="-141" width="36" height="36" rx="5" opacity="0.66" transform="rotate(138)"/>
      <rect x="-17" y="-128" width="34" height="34" rx="5" opacity="0.74" transform="rotate(184)"/>
      <rect x="-15" y="-117" width="30" height="30" rx="4" opacity="0.82" transform="rotate(230)"/>
      <rect x="-14" y="-106" width="28" height="28" rx="4" opacity="0.90" transform="rotate(276)"/>
      <rect x="-12" y="-97" width="24" height="24" rx="4" opacity="1" transform="rotate(322)"/>
    </g>
    <g fill="#9BDCFF">
      <rect x="-11" y="-84" width="22" height="22" rx="3" transform="rotate(20)"/>
      <rect x="-10" y="-74" width="20" height="20" rx="3" transform="rotate(78)"/>
      <rect x="-9" y="-65" width="18" height="18" rx="3" transform="rotate(136)"/>
      <rect x="-8" y="-57" width="16" height="16" rx="3" transform="rotate(194)"/>
    </g>
    <rect x="-42" y="-42" width="84" height="84" rx="12" fill="#F4FBFF"/>
  </g>
</svg>
