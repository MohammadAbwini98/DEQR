<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d141d" media="(prefers-color-scheme: dark)" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DEQR Receive" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- A tab favicon is drawn at 16-32px, so this is the micro treatment, not
         the full mark. The full mark is the manifest's vector entry. -->
    <link rel="icon" href="./icons/deqr-chip.svg" type="image/svg+xml" />
    <!-- Browsers without SVG favicon support fall back to this rather than to
         a request for /favicon.ico that the packaged host would answer with a
         404 on every load. -->
    <link rel="alternate icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <title>DEQR Receive</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
